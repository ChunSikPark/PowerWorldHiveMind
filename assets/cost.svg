<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Accuracy vs. cost on 8 hard PowerWorld questions</title>
  <rect x="0" y="0" width="820" height="500" fill="#ffffff"/>

  <!-- Title / subtitle -->
  <text x="410" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#0b0b0b">Accuracy and cost do not move together</text>
  <text x="410" y="42" text-anchor="middle" font-size="12.5" fill="#52514e">8 hard PowerWorld questions, three setups. Bubble area is proportional to tokens read.</text>

  <!-- Gridlines: vertical (time) -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="90" y1="95" x2="90" y2="400"/>
    <line x1="228" y1="95" x2="228" y2="400"/>
    <line x1="366" y1="95" x2="366" y2="400"/>
    <line x1="504" y1="95" x2="504" y2="400"/>
    <line x1="642" y1="95" x2="642" y2="400"/>
    <line x1="780" y1="95" x2="780" y2="400"/>
  </g>
  <!-- Gridlines: horizontal (correct) -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="90" y1="400" x2="780" y2="400"/>
    <line x1="90" y1="323.75" x2="780" y2="323.75"/>
    <line x1="90" y1="247.5" x2="780" y2="247.5"/>
    <line x1="90" y1="171.25" x2="780" y2="171.25"/>
    <line x1="90" y1="95" x2="780" y2="95"/>
  </g>

  <!-- Axes -->
  <line x1="90" y1="400" x2="780" y2="400" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="90" y1="95" x2="90" y2="400" stroke="#c3c2b7" stroke-width="1.5"/>

  <!-- X tick labels (wall-clock minutes) -->
  <g font-size="11" fill="#898781" text-anchor="middle">
    <text x="90" y="415">0</text>
    <text x="228" y="415">2</text>
    <text x="366" y="415">4</text>
    <text x="504" y="415">6</text>
    <text x="642" y="415">8</text>
    <text x="780" y="415">10</text>
  </g>
  <text x="435" y="438" text-anchor="middle" font-size="13" fill="#52514e">Wall-clock time to answer all 8 questions (minutes)</text>

  <!-- Y tick labels (correct out of 8) -->
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="80" y="404">0</text>
    <text x="80" y="327.75">2</text>
    <text x="80" y="251.5">4</text>
    <text x="80" y="175.25">6</text>
    <text x="80" y="99">8</text>
  </g>
  <text x="30" y="247.5" text-anchor="middle" font-size="13" fill="#52514e" transform="rotate(-90 30 247.5)">Correct answers (out of 8)</text>

  <!-- Bubbles: radius = 14.41 * sqrt(tokens read in millions), area proportional to tokens -->
  <!-- AI + web: 8.6 min, 1/8 correct, 8.5M tokens -->
  <circle cx="683.4" cy="361.875" r="42.0" fill="#eb6834" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <!-- HiveMind: 4.6 min, 8/8 correct, 5.8M tokens -->
  <circle cx="407.4" cy="95" r="34.7" fill="#2a78d6" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>
  <!-- AI alone: 2.8 min, 0/8 correct, 1.2M tokens -->
  <circle cx="283.2" cy="400" r="15.8" fill="#1baf7a" fill-opacity="0.82" stroke="#ffffff" stroke-width="2"/>

  <!-- Direct labels -->
  <g font-size="12.5" font-weight="700" fill="#0b0b0b">
    <text x="452" y="88">HiveMind</text>
    <text x="283.2" y="358" text-anchor="middle">AI alone</text>
    <text x="630" y="350" text-anchor="end">AI + web</text>
  </g>
  <g font-size="11" fill="#52514e">
    <text x="452" y="104">8/8 correct &#183; 4.6 min &#183; 5.8M tokens</text>
    <text x="283.2" y="374" text-anchor="middle">0/8 correct &#183; 2.8 min &#183; 1.2M tokens</text>
    <text x="630" y="366" text-anchor="end">1/8 correct &#183; 8.6 min &#183; 8.5M tokens</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="90" y="462" width="12" height="12" fill="#1baf7a"/>
    <text x="108" y="472">AI alone</text>
    <rect x="280" y="462" width="12" height="12" fill="#2a78d6"/>
    <text x="298" y="472">HiveMind</text>
    <rect x="450" y="462" width="12" height="12" fill="#eb6834"/>
    <text x="468" y="472">AI + web</text>
  </g>
</svg>
