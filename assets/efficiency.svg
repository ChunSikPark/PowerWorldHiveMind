<svg xmlns="http://www.w3.org/2000/svg" width="850" height="440" viewBox="0 0 850 440" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<rect x="0" y="0" width="850" height="440" fill="#f6f8fa"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#0b0b0b">Cost efficiency: tokens burned per correct answer</text>
<text x="20" y="50" font-size="12.5" fill="#52514e">HiveMind vs. AI alone and AI + web search &#8212; lower bars are cheaper per correct answer. Each label shows accuracy so cheap is not read as good.</text>
<text x="20" y="94" font-size="13" font-weight="700" fill="#0b0b0b">Silent-failure questions (16 questions)</text>
<text x="160" y="118.0" font-size="12.5" fill="#0b0b0b" text-anchor="end">AI alone</text>
<rect x="170" y="102" width="64.21" height="24" rx="4" ry="4" fill="#2a78d6"/>
<text x="244.21" y="118.0" font-size="12" fill="#52514e">539,167 tok &#8212; 4/16 correct</text>
<text x="160" y="157.0" font-size="12.5" fill="#0b0b0b" text-anchor="end">HiveMind</text>
<rect x="170" y="141" width="88.54" height="24" rx="4" ry="4" fill="#eb6834"/>
<text x="268.54" y="157.0" font-size="12" fill="#52514e">743,521 tok &#8212; 16/16 correct</text>
<text x="160" y="196.0" font-size="12.5" fill="#0b0b0b" text-anchor="end">AI + web</text>
<rect x="170" y="180" width="440.00" height="24" rx="4" ry="4" fill="#1baf7a"/>
<text x="620.00" y="196.0" font-size="12" fill="#52514e">3,694,902 tok &#8212; 4/16 correct</text>
<text x="20" y="266" font-size="13" font-weight="700" fill="#0b0b0b">Command-lookup questions (7 questions)</text>
<text x="160" y="290.0" font-size="12.5" fill="#0b0b0b" text-anchor="end">AI alone</text>
<rect x="170" y="274" width="47.50" height="24" rx="4" ry="4" fill="#2a78d6"/>
<text x="227.50" y="290.0" font-size="12" fill="#52514e">398,841 tok &#8212; 4/7 correct</text>
<text x="160" y="329.0" font-size="12.5" fill="#0b0b0b" text-anchor="end">AI + web</text>
<rect x="170" y="313" width="170.38" height="24" rx="4" ry="4" fill="#1baf7a"/>
<text x="350.38" y="329.0" font-size="12" fill="#52514e">1,430,796 tok &#8212; 7/7 correct</text>
<text x="160" y="368.0" font-size="12.5" fill="#0b0b0b" text-anchor="end">HiveMind</text>
<rect x="170" y="352" width="341.39" height="24" rx="4" ry="4" fill="#eb6834"/>
<text x="521.39" y="368.0" font-size="12" fill="#52514e">2,866,797 tok &#8212; 6/7 correct</text>
