<line x1="527.25" y1="399" x2="527.25" y2="404" stroke="#c3c2b7" stroke-width="1"/>
<text x="527.25" y="417" font-size="10.5" fill="#898781" text-anchor="middle">3M</text>
<line x1="610.00" y1="399" x2="610.00" y2="404" stroke="#c3c2b7" stroke-width="1"/>
<text x="610.00" y="417" font-size="10.5" fill="#898781" text-anchor="end">3.69M (max)</text>
<text x="390.00" y="430" font-size="11" fill="#52514e" text-anchor="middle">tokens per correct answer (shared scale, both groups)</text>
