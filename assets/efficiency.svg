<line x1="170.00" y1="399" x2="170.00" y2="404" stroke="#c3c2b7" stroke-width="1"/>
<text x="170.00" y="417" font-size="10.5" fill="#898781" text-anchor="start">0</text>
<line x1="289.08" y1="399" x2="289.08" y2="404" stroke="#c3c2b7" stroke-width="1"/>
