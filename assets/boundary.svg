<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#1f2328">When there is no answer, does it say so?</text>
  <text x="30" y="54" font-size="12.5" fill="#57606a">10 benchmark questions with no correct answer available. Correct behavior: decline rather than invent one.</text>

  <!-- axis gridlines and ticks: 0..10 questions, 60px per question, bar area x=190..790 -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="190" y1="90" x2="190" y2="300"/>
    <line x1="250" y1="90" x2="250" y2="300"/>
    <line x1="310" y1="90" x2="310" y2="300"/>
    <line x1="370" y1="90" x2="370" y2="300"/>
    <line x1="430" y1="90" x2="430" y2="300"/>
    <line x1="490" y1="90" x2="490" y2="300"/>
    <line x1="550" y1="90" x2="550" y2="300"/>
    <line x1="610" y1="90" x2="610" y2="300"/>
    <line x1="670" y1="90" x2="670" y2="300"/>
    <line x1="730" y1="90" x2="730" y2="300"/>
    <line x1="790" y1="90" x2="790" y2="300"/>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="190" y="314">0</text>
    <text x="310" y="314">2</text>
    <text x="430" y="314">4</text>
    <text x="550" y="314">6</text>
    <text x="670" y="314">8</text>
    <text x="790" y="314">10</text>
  </g>
  <text x="490" y="330" font-size="11" fill="#57606a" text-anchor="middle">of 10 questions</text>

  <!-- Row 1: with HiveMind -->
  <text x="180" y="103" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">HiveMind</text>
  <!-- 5 good declines -->
  <rect x="190" y="86" width="300" height="34" fill="#1a7f37"/>
  <text x="340" y="108" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">5 declined (correctly)</text>
  <!-- 3 declines that public docs actually cover -->
  <rect x="490" y="86" width="180" height="34" fill="#bf8700"/>
  <text x="580" y="108" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">3 declined (docs existed)</text>
  <!-- 2 invented -->
  <rect x="670" y="86" width="120" height="34" fill="#cf222e"/>
  <text x="730" y="108" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">2 invented</text>

  <!-- Row 2: AI + web -->
  <text x="180" y="179" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">AI + web</text>
  <rect x="190" y="162" width="60" height="34" fill="#1a7f37"/>
  <text x="220" y="184" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
  <rect x="250" y="162" width="540" height="34" fill="#cf222e"/>
  <text x="520" y="184" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">9 invented</text>

  <!-- Row 3: AI alone -->
  <text x="180" y="255" font-size="13" fill="#1f2328" text-anchor="end" font-weight="600">AI alone</text>
  <rect x="190" y="238" width="600" height="34" fill="#cf222e"/>
  <text x="490" y="260" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">10 invented — declined 0 of 10</text>

  <!-- legend -->
  <g font-size="12.5" fill="#1f2328">
    <rect x="30" y="358" width="16" height="16" fill="#1a7f37"/>
    <text x="52" y="371">Declined, and nothing public covers it (good outcome)</text>

    <rect x="30" y="382" width="16" height="16" fill="#bf8700"/>
    <text x="52" y="395">Declined, but public PowerWorld docs do cover it (HiveMind's blind spot)</text>

    <rect x="30" y="406" width="16" height="16" fill="#cf222e"/>
    <text x="52" y="419">Invented an answer instead of declining</text>
  </g>

  <line x1="30" y1="438" x2="790" y2="438" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="458" font-size="12" fill="#57606a">HiveMind declines far more often than a fresh AI (8/10 vs 0/10) — but 3 of those 8 declines were a browser search away from a real answer.</text>
</svg>
