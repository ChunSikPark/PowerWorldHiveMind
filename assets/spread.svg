<text x="20" y="32" font-size="19" font-weight="700" fill="#0b0b0b">What a question costs is how long the search took</text>
<text x="20" y="56" font-size="14" fill="#52514e">Each dot is one question. Across is how many times it searched; up is how much text it had to read.</text>
<text x="20" y="78" font-size="14" fill="#52514e">The range is 205k to 1.75M tokens &#8212; 9x, on the same pages, decided entirely by how fast the right page was found.</text>
